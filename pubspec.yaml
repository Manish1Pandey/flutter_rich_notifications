name: flutter_rich_notifications
description: >-
  Push notifications with a full hero image AND full multi-line body, for
  Android (custom RemoteViews) and iOS (Notification Content Extension).
version: 0.1.0
homepage: https://github.com/Manish1Pandey/flutter_rich_notifications
repository: https://github.com/Manish1Pandey/flutter_rich_notifications
issue_tracker: https://github.com/Manish1Pandey/flutter_rich_notifications/issues

topics:
  - notifications
  - push
  - fcm
  - rich-media
  - firebase

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: app.notifly.flutter_rich_notifications
        pluginClass: FlutterRichNotificationsPlugin
      ios:
        pluginClass: FlutterRichNotificationsPlugin
